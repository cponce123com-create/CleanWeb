kind = "web"
previewPath = "/"
title = "CleanWeb.tools"
version = "1.0.0"
id = "artifacts/cleanweb-tools"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23891

[services.development]
run = "pnpm --filter @workspace/cleanweb-tools run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cleanweb-tools", "run", "build" ]
publicDir = "artifacts/cleanweb-tools/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23891"
BASE_PATH = "/"
